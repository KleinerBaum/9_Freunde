name: Photo MVP

on:
  push:
  pull_request:

jobs:
  photo-mvp:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Compile photo MVP files
        run: python -m compileall app.py services/photo_share_service.py ui/photos.py

      - name: Run photo tests
        run: python -m pytest tests/test_photo_share_service.py tests/test_photo_ui_smoke.py
